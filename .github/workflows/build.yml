name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate stamps
        run: python generate_stamps.py
        env:
          PYTHONUTF8: "1"

      - name: Find customtkinter path
        id: ctk
        shell: pwsh
        run: |
          $ctkPath = python -c "import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))"
          echo "CTK_PATH=$ctkPath" >> $env:GITHUB_OUTPUT
          echo "Found customtkinter at: $ctkPath"

      - name: Verify customtkinter assets
        shell: pwsh
        run: |
          $ctkPath = "${{ steps.ctk.outputs.CTK_PATH }}"
          echo "=== customtkinter directory ==="
          Get-ChildItem -Path $ctkPath -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          echo "=== JSON theme files ==="
          Get-ChildItem -Path $ctkPath -Recurse -Filter "*.json" | Select-Object FullName

      - name: Build EXE
        shell: pwsh
        run: |
          $ctkPath = "${{ steps.ctk.outputs.CTK_PATH }}"
          pyinstaller --onefile --windowed `
            --name "TitanCleaner" `
            --add-data "assets\stamps;assets\stamps" `
            --add-data "${ctkPath};customtkinter" `
            --hidden-import customtkinter `
            --hidden-import darkdetect `
            --hidden-import core.english_pseudonyms `
            --hidden-import core.deanonymizer `
            --hidden-import core.database `
            --collect-all customtkinter `
            main.py
          echo "=== Build result ==="
          Get-ChildItem dist\TitanCleaner.exe | Format-Table Name, Length

      - name: Prepare portable folder
        shell: pwsh
        run: |
          # Создаём папку для portable-сборки
          New-Item -ItemType Directory -Path dist\portable\TitanCleaner -Force
          # Перемещаем .exe
          Move-Item dist\TitanCleaner.exe dist\portable\TitanCleaner\ -Force
          echo "EXE moved to portable folder"

      - name: Install Tesseract via choco
        run: choco install tesseract --no-progress -y

      - name: Bundle portable Tesseract
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "dist\portable\TitanCleaner\tesseract"
          New-Item -ItemType Directory -Path "$dst\tessdata" -Force
          Copy-Item "$src\tesseract.exe" "$dst\"
          Copy-Item "$src\*.dll" "$dst\"
          Copy-Item "$src\tessdata\eng.traineddata" "$dst\tessdata\"
          Copy-Item "$src\tessdata\osd.traineddata" "$dst\tessdata\"
          $rusUrl = "https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata"
          Invoke-WebRequest -Uri $rusUrl -OutFile "$dst\tessdata\rus.traineddata"
          Get-ChildItem -Recurse "$dst" | Format-Table Name, Length

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\portable\TitanCleaner -DestinationPath dist\TitanCleaner-Portable.zip
          echo "=== Final ZIP ==="
          Get-ChildItem dist\TitanCleaner-Portable.zip | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanCleaner-Portable
          path: dist/TitanCleaner-Portable.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TitanCleaner-Portable.zip
          generate_release_notes: true
